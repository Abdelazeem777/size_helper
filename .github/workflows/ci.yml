name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          flutter pub get --directory example

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/

      # Covers example/ too. Infos are not fatal: new stable releases add
      # deprecations (e.g. Flutter 3.50 deprecates package:flutter/material.dart
      # in favour of material_ui) that we can't adopt without raising the SDK
      # floor. Warnings and errors still fail the build.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests (VM) with coverage
        run: flutter test --coverage

      # kIsWeb can only be exercised in a browser.
      - name: Run web tests (Chrome)
        run: flutter test --platform chrome test/size_helper_web_test.dart

      - name: Run example tests
        working-directory: example
        run: flutter test

      - name: Build example for web
        working-directory: example
        run: flutter build web
